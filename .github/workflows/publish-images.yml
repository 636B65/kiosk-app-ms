name: Publish container images

# Pushes to main publish every image as :main (what the dev overlay deploys);
# a v* tag (pushed by release.yml or by hand) publishes :X.Y.Z and :latest and
# creates the GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, e.g. v1.0.3
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Owner must be lowercase for GHCR.
  IMAGE_BASE: ghcr.io/636b65/kiosk-app-ms
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  publish:
    name: Build and publish (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - auth-service
          - catalog-service
          - customer-service
          - order-service
          - settings-service
          - audit-service
          - report-service
          - system-service
          - frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ startsWith(env.TAG, 'v') && format('refs/tags/{0}', env.TAG) || github.sha }}

      - name: Resolve commit
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_BASE }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }},enable=${{ startsWith(env.TAG, 'v') }}
            type=raw,value=latest,enable=${{ startsWith(env.TAG, 'v') }}
            type=raw,value=main,enable=${{ env.TAG == 'main' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image == 'frontend' && 'frontend' || '.' }}
          file: ${{ matrix.image == 'frontend' && 'frontend/Dockerfile' || 'docker/service.Dockerfile' }}
          platforms: linux/amd64,linux/arm64
          build-contexts: |
            repo=.
          build-args: |
            SERVICE=${{ matrix.image }}
            PG_CLIENT=${{ matrix.image == 'system-service' && '1' || '' }}
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_COMMIT=${{ steps.rev.outputs.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_BASE }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    name: Create GitHub Release
    needs: publish
    if: startsWith(inputs.tag || github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: List the released image digests
        run: |
          version="${TAG#v}"
          out="kiosk-app-ms-$TAG-images.txt"
          for image in auth-service catalog-service customer-service order-service settings-service \
                       audit-service report-service system-service frontend; do
            digest="$(docker buildx imagetools inspect "$IMAGE_BASE/$image:$version" --format '{{json .Manifest}}' | jq -r .digest)"
            echo "$IMAGE_BASE/$image:$version@$digest"
          done > "$out"
          cat "$out"
          echo "IMAGES_FILE=$out" >> "$GITHUB_ENV"

      - name: Sign the release (build provenance)
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.IMAGES_FILE }}

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          notes="$RUNNER_TEMP/notes.md"
          awk -v head="## [$version]" '
            /^## \[/ { if (found) exit; if (index($0, head) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::CHANGELOG.md has no [$version] section"
            exit 1
          fi
          prev="$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            printf '\n**Full Changelog**: %s/%s/compare/%s...%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$prev" "$TAG" >> "$notes"
          fi
          cat "$notes"

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "$IMAGES_FILE.intoto.jsonl"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
            gh release upload "$TAG" "$IMAGES_FILE" "$IMAGES_FILE.intoto.jsonl" --clobber
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" \
              "$IMAGES_FILE" "$IMAGES_FILE.intoto.jsonl"
          fi
