name: Track kiosk-app

# Checks daily for a new release of kiosk-app (the monolith this repository
# was split from). When one exists, it syncs the frontend, records the
# backend changes to port, bumps upstream/kiosk-app.version on a branch and
# opens a pull request (or an issue, if the repository does not allow GitHub
# Actions to create pull requests). No secrets needed.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

env:
  UPSTREAM_REPO: 636B65/kiosk-app

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare ported and latest kiosk-app version
        id: check
        run: |
          current="$(tr -d '[:space:]' < upstream/kiosk-app.version)"
          latest="$(git ls-remote --tags --refs "https://github.com/$UPSTREAM_REPO.git" 'v*' \
            | sed 's|.*refs/tags/||' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -n1)"
          echo "Ported: $current, latest: $latest"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          newest="$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n1)"
          if [[ -n "$latest" && "$latest" != "$current" && "$newest" == "$latest" ]]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          else
            echo "update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out kiosk-app
        if: steps.check.outputs.update == 'true'
        run: git clone --quiet "https://github.com/$UPSTREAM_REPO.git" upstream-src

      - name: Sync frontend, record changes and open pull request
        if: steps.check.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ steps.check.outputs.current }}
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          branch="track/kiosk-app-$LATEST"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "Branch $branch already exists - nothing to do."
            exit 0
          fi

          # Release notes since the ported version, and the backend diff to port.
          mkdir -p upstream/changes
          awk -v to="## [${LATEST#v}]" -v from="## [${CURRENT#v}]" '
            /^## \[/ { if (index($0, from) == 1) exit; if (index($0, to) == 1) on = 1 }
            on { print }
          ' upstream-src/CHANGELOG.md > "upstream/changes/$LATEST.md"
          git -C upstream-src diff "$CURRENT" "$LATEST" -- backend tests docker-compose.yml frontend/nginx.conf frontend/Dockerfile \
            > "upstream/changes/$LATEST-backend.diff"
          stat="$(git -C upstream-src diff --shortstat "$CURRENT" "$LATEST" -- backend)"

          # The UI is shared with kiosk-app: copy it as is.
          git -C upstream-src checkout --quiet "$LATEST"
          sh scripts/sync-frontend.sh upstream-src
          rm -rf upstream-src

          echo "$LATEST" > upstream/kiosk-app.version

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "Track kiosk-app $LATEST"
          git push -u origin "$branch"
          # Pushes made with GITHUB_TOKEN do not start CI; a dispatch does.
          gh workflow run ci.yml --ref "$branch" || true

          title="Track kiosk-app $LATEST"
          cat > body.md <<BODY
          kiosk-app has a new release: **$CURRENT -> $LATEST**.

          - Release notes: https://github.com/$UPSTREAM_REPO/releases/tag/$LATEST
          - Changes: https://github.com/$UPSTREAM_REPO/compare/$CURRENT...$LATEST

          Done on this branch:
          - Frontend (\`index.html\`, \`css/\`, \`js/\`) copied from kiosk-app $LATEST.
          - \`upstream/kiosk-app.version\` set to $LATEST.

          To do before merging (backend: ${stat:-no changes}):
          - Port \`upstream/changes/$LATEST-backend.diff\` into the services, following \`upstream/PORTING.md\`.
          - Add a version section to CHANGELOG.md so the release workflow publishes new images.

          $(cat "upstream/changes/$LATEST.md")
          BODY

          if ! gh pr create --base main --head "$branch" --title "$title" --body-file body.md; then
            echo "::warning::Could not open a pull request (enable 'Allow GitHub Actions to create and approve pull requests'). Opening an issue instead."
            printf '\nBranch with the update: `%s`\n' "$branch" >> body.md
            gh issue create --title "$title" --body-file body.md
          fi
