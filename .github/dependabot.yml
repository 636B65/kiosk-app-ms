# Dependabot version updates for every pinned dependency in this repository.
# Python requirements are pip-compile lock files (requirements*.in -> *.txt with
# hashes); Dependabot regenerates them. Actions are pinned to commit SHAs and
# images to digests; Dependabot updates the SHA/digest and the version comment.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(pip)"
      include: "scope"
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/tests/fuzz"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(pip)"
      include: "scope"
    groups:
      fuzz:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directories: ["/docker", "/frontend", "/.clusterfuzzlite"]
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(docker)"
      include: "scope"
    ignore:
      # The services target Python 3.12; moving to a new Python is a deliberate
      # change (tests, lock files), so only new digests/patches come automatically.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(compose)"
      include: "scope"
    ignore:
      # A new Postgres major needs a data upgrade (pg_upgrade/dump+restore) and a
      # matching pg_dump in the system-service image; do it deliberately.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # ghcr.io/ossf/scorecard-action:v2.6.0 references a platform image that is
      # missing from the registry (docker pull: manifest not found); stay on 2.5.0
      # until a fixed release, which Dependabot will still propose.
      - dependency-name: "ossf/scorecard-action"
        versions: ["2.6.0"]
